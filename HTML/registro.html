<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Completo</title>
  <link rel="stylesheet" href="../CSS/registro.css">
</head>

<body>

<div class="container">

  <!-- Barra progreso -->
  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- PASO 1 -->
  <div class="step active">
    <h2>Cuenta</h2>
    <input type="email" id="email" placeholder="Correo">
    <input type="password" id="password" placeholder="Contraseña">
    <input type="password" id="confirmPassword" placeholder="Repetir contraseña">
  </div>

  <!-- PASO 2 -->
  <div class="step">
    <h2>Datos personales</h2>
    <input type="text" id="nombre" placeholder="Nombre">
    <input type="text" id="apellido" placeholder="Apellidos">
    <input type="date" id="fecha">
  </div>

  <!-- PASO 3 -->
  <div class="step">
    <h2>Perfil</h2>
    <input type="text" id="usuario" placeholder="Usuario">
    <textarea id="bio" placeholder="Biografía"></textarea>
  </div>

  <!-- PASO 4 -->
  <div class="step">
    <h2>Confirmación</h2>
    <label><input type="checkbox" id="terms"> Acepto términos</label>
  </div>

  <!-- BOTONES -->
  <div class="buttons">
    <button id="prevBtn">Atrás</button>
    <button id="nextBtn">Siguiente</button>
  </div>

</div>

<script src="../Java_Script/registro.js"></script>

</body>
</html>
