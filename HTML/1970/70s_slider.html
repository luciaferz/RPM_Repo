<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1970 - Muscle y Estilo</title>

    <link rel="stylesheet" href="styles70.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="Titulo_Seccion70s">1970 - Muscle y Estilo</h1>
      <section class="slider">
        <div class="slides-group">
          <div class="slide">
            <img
              src="img/Lamborghini_1.webp"
              alt="Lamborghini Countach Frente"
            />
            <span class="overlay">Lamborghini Countach</span>
          </div>
          <div class="slide">
            <img
              src="img/Lamborghini_2.jpg"
              alt="Lamborghini Countach Destras"
            />
            <span class="overlay">Lamborghini Countach</span>
          </div>
          <div class="slide">
            <img
              src="img/Lamborghini_3.jpg"
              alt="Lamborghini Countach Interior"
            />
            <span class="overlay">Lamborghini Countach</span>
          </div>
        </div>

        <div class="slides-group">
          <div class="slide">
            <img src="img/Porsche_1.jfif" alt="Porsche 911 Frente" />
            <span class="overlay">Porsche 911</span>
          </div>
          <div class="slide">
            <img src="img/Porsche_2.webp" alt="Porsche 911 Destras" />
            <span class="overlay">Porsche 911</span>
          </div>
          <div class="slide">
            <img src="img/Porsche_3.jpg" alt="Porsche 911 Interior" />
            <span class="overlay">Porsche 911</span>
          </div>
        </div>

        <div class="slides-group">
          <div class="slide">
            <img src="img/Dodge_1.jfif" alt="Dodge Challenger Frente" />
            <span class="overlay">Dodge Challenger</span>
          </div>
          <div class="slide">
            <img src="img/Dodge_2.jpg" alt="Dodge Challenger Destras" />
            <span class="overlay">Dodge Challenger</span>
          </div>
          <div class="slide">
            <img src="img/Dodge_3.jpg" alt="Dodge Challenger Interior" />
            <span class="overlay">Dodge Challenger</span>
          </div>
        </div>
      </section>
    </div>
    <script src="../../js/script.js"></script>
  </body>
</html>
