    <!-- ============================================
         MAIN - Contenido principal

    <main>
      <h1 class="Titulo_Seccion60s">1960 – Los Clásicos</h1>

      <!-- Contenedor de tarjetas de coches -->
      <div class="car-scroll">
        
        <!-- ============================================
             TARJETA 1: Ford Mustang
             Estructura flip-card:
             - car-card: contenedor principal con perspective
             - card-inner: elemento que gira 180°
             - card-front: cara visible inicialmente (imagen)
             - card-back: cara oculta (información)
             ============================================ -->
        <article id="mustang-69" class="car-card">
          <!-- Título del coche (fuera del flip para que siempre sea visible) -->
          <h2 class="subtitulo">Ford Mustang</h2>
          
          <!-- Contenedor interno que realiza el giro -->
          <div class="card-inner">
            <!-- Cara frontal: imagen del coche -->
            <div class="card-front">
              <img src="img/Mustang_1.jpg" alt="Ford Mustang - Vista frontal" />
            </div>
            <!-- Cara trasera: información del coche -->
            <div class="card-back">
              <h2>Ford Mustang 1967</h2>
              <p>Motor V8, 450 CV</p>
              <p>Color: Rojo</p>
            </div>
          </div>
          
          <!-- Imágenes adicionales (vista trasera e interior) -->
          <img class="car-image" src="img/Mustang_2.webp" alt="Ford Mustang - Vista trasera" />
          <img class="car-image" src="img/Muestang_3.webp" alt="Ford Mustang - Interior" />
        </article>

        <!-- ============================================
             TARJETA 2: Chevrolet Camaro
             Misma estructura flip-card
             ============================================ -->
        <article id="camaro-67" class="car-card">
          <h2 class="subtitulo">Chevrolet Camaro</h2>
          <div class="card-inner">
            <div class="card-front">
              <img src="img/Camaro_1.jpg" alt="Chevrolet Camaro - Vista frontal" />
            </div>
            <div class="card-back">
              <h2>Chevrolet Camaro</h2>
              <p>Motor V8, 480 CV</p>
              <p>Color: Azul</p>
            </div>
          </div>
          <img class="car-image" src="img/Camaro_2.avif" alt="Chevrolet Camaro - Vista trasera" />
          <img class="car-image" src="img/Camaro_3.jpg" alt="Chevrolet Camaro - Interior" />
        </article>

        <!-- ============================================
             TARJETA 3: Volkswagen Beetle
             ============================================ -->
        <article id="escarabajo-65" class="car-card">
          <h2 class="subtitulo">Volkswagen Beetle</h2>
          <div class="card-inner">
            <div class="card-front">
              <img src="img/Escarabajo_1.webp" alt="Volkswagen Beetle - Vista frontal" />
            </div>
            <div class="card-back">
              <h2>Volkswagen Beetle</h2>
              <p>Motor 1.3, 50 CV</p>
              <p>Color: Verde</p>
            </div>
          </div>
          <img class="car-image" src="img/Escarabajo_2.jpg" alt="Volkswagen Beetle - Vista trasera" />
          <img class="car-image" src="img/Escarabajo_3.jpg" alt="Volkswagen Beetle - Interior" />
        </article>

      </div>
    </main>
