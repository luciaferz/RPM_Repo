<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contacto RPM - Propuestas, colaboración y consultas sobre el proyecto." />
    <title>RPM - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../CSS/styles.css" />
    <link rel="stylesheet" href="../../CSS/contacto.css" />
  </head>
  <body class="contact-page">
    <nav class="Menu">
      <a href="../Home/Home.html" class="nav-link-home">RPM</a>
      <ul>
        <li><a href="../Decadas/secciones.html?decada=1960" class="nav-link">60s</a></li>
        <li><a href="../Decadas/secciones.html?decada=1970" class="nav-link">70s</a></li>
        <li><a href="../Decadas/secciones.html?decada=1980" class="nav-link">80s</a></li>
        <li><a href="../Decadas/secciones.html?decada=1990" class="nav-link">90s</a></li>
        <li><a href="../Decadas/secciones.html?decada=2000" class="nav-link">00s</a></li>
        <li><a href="../Decadas/secciones.html?decada=2010" class="nav-link">10s</a></li>
      </ul>
    </nav>

    <main class="contact-main">
      <section class="contact-hero">
        <p class="contact-kicker">Contacto RPM</p>
        <h1>Escríbenos</h1>
        <p>Si quieres proponer mejoras o compartir una idea, usa este formulario.</p>
      </section>

      <section class="contact-card">
        <h2>Mensaje</h2>
        <form class="contact-form" action="#" method="post">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" placeholder="Tu nombre" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="tu@email.com" required />

          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe tu mensaje" required></textarea>

          <div class="contact-actions">
            <button type="submit">Enviar</button>
            <a href="../Home/Home.html">Volver a Home</a>
          </div>
        </form>
      </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../Java_Script/script.js"></script>
  </body>
</html>
